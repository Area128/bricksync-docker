name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
        docker login --username Area128 --password ${{ secrets.REG_TOKEN }} ghcr.io
        docker build . --file Dockerfile.ui --tag bricksync-ui:first
        docker push ghcr.io/area128/bricksync-ui:first
