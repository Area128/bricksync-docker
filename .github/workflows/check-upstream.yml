name: Get latest release version and build a new image
on:
  schedule:
    - cron:  '51 6 * * *'
  workflow_dispatch:
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Fetch release version
        id: latestrelease
        run: echo "latestrelease=$( curl -sL https://api.github.com/repos/ZZJHONS/Bricksync/releases/latest | jq -r '.tag_name' )" >> $GITHUB_OUTPUT

      - name: Check if we have build the cli image before
        id: cli_image_exists
        shell: bash
        run: |
          curl -H "Authorization: Bearer QQ==" -H 'Accept: application/vnd.oci.image.index.v1+json' https://ghcr.io/v2/area128/bricksync-docker/manifests/cli-${{ steps.latestrelease.outputs.latestrelease }} > response.out
          Err=$(jq '.errors' -r response.out)
          echo $Err
          cat response.out
          if [[ $Err == "null" ]]
          then
            echo "exists=1" >> $GITHUB_OUTPUT;
          else
            echo "exists=0" >> $GITHUB_OUTPUT;
          fi

      - name: Check if we have build the ui image before
        id: ui_image_exists
        shell: bash
        run: |
          curl -H "Authorization: Bearer QQ==" -H 'Accept: application/vnd.oci.image.index.v1+json' https://ghcr.io/v2/area128/bricksync-docker/manifests/ui-${{ steps.latestrelease.outputs.latestrelease }} > response.out
          Err=$(jq '.errors' -r response.out)
          echo $Err
          cat response.out
          if [[ $Err == "null" ]]
          then
            echo "exists=1" >> $GITHUB_OUTPUT;
          else
            echo "exists=0" >> $GITHUB_OUTPUT;
          fi

      - name: Build the cli Docker image
        if: ${{ steps.cli_image_exists.outputs.exists == false }}
        run: |
          docker login --username Area128 --password ${{ github.token }} ghcr.io
          docker buildx build . --file Dockerfile.cli --tag ghcr.io/area128/bricksync-docker:cli-${{ steps.latestrelease.outputs.latestrelease }} --no-cache --progress plain --build-arg RELEASE_TAG=${{ steps.latestrelease.outputs.latestrelease }}
          docker image tag ghcr.io/area128/bricksync-docker:cli-${{ steps.latestrelease.outputs.latestrelease }} ghcr.io/area128/bricksync-docker:cli-latest
          docker push ghcr.io/area128/bricksync-docker:cli-${{ steps.latestrelease.outputs.latestrelease }}
          docker push ghcr.io/area128/bricksync-docker:cli-latest

      - name: Build the ui Docker image
        if: ${{ steps.ui_image_exists.outputs.exists == false }}
        run: |
          docker login --username Area128 --password ${{ github.token }} ghcr.io
          docker buildx build . --file Dockerfile.ui --tag ghcr.io/area128/bricksync-docker:ui-${{ steps.latestrelease.outputs.latestrelease }} --no-cache --progress plain --build-arg RELEASE_TAG=${{ steps.latestrelease.outputs.latestrelease }}
          docker image tag ghcr.io/area128/bricksync-docker:ui-${{ steps.latestrelease.outputs.latestrelease }} ghcr.io/area128/bricksync-docker:ui-latest
          docker push ghcr.io/area128/bricksync-docker:ui-${{ steps.latestrelease.outputs.latestrelease }}
          docker push ghcr.io/area128/bricksync-docker:ui-latest


