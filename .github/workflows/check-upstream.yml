name: Get latest release version and build a new image
on:
  schedule:
    - cron:  '51 6 * * *'
  workflow_dispatch:
jobs:
  get-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Fetch release version
        id: latestrelease
        run: echo "latestrelease=$( curl -sL https://api.github.com/repos/ZZJHONS/Bricksync/releases/latest | jq -r '.tag_name' )" >> $GITHUB_OUTPUT

      - name: Check if we've already published the cli image
        id: cli_image_exists # used by other steps.
        uses: razonyang/github-action-docker-image-tag-exists@v1
        with:
          owner: area128
          name:  bricksync-docker
          tag: "cli-${{ steps.latestrelease.outputs.latestrelease }}"

      - name: Check if we've already published the ui image
        id: ui_image_exists # used by other steps.
        uses: razonyang/github-action-docker-image-tag-exists@v1
        with:
          owner: area128
          name:  bricksync-docker
          tag: "ui-${{ steps.latestrelease.outputs.latestrelease }}"

      - name: Build the cli Docker image
        if: ${{ steps.cli_image_exists.outputs.exists == false }}
        run: |
          docker login --username Area128 --password ${{ github.token }} ghcr.io

          sed "s/ENV BS_RELEASE_TAG=HEAD/ENV BS_RELEASE_TAG=${{ steps.latestrelease.outputs.latestrelease }}/" Dockerfile.cli

          docker build . --file Dockerfile.cli --tag ghcr.io/area128/bricksync-docker:cli-${{ steps.latestrelease.outputs.latestrelease }}
          docker image tag ghcr.io/area128/bricksync-docker:cli-${{ steps.latestrelease.outputs.latestrelease }} ghcr.io/area128/bricksync-docker:cli-latest
          docker push ghcr.io/area128/bricksync-docker:cli-${{ steps.latestrelease.outputs.latestrelease }}
          docker push ghcr.io/area128/bricksync-docker:cli-latest

      - name: Build the ui Docker image
        if: ${{ steps.ui_image_exists.outputs.exists == false }}
        run: |
          docker login --username Area128 --password ${{ github.token }} ghcr.io

          sed "s/ENV BS_RELEASE_TAG=HEAD/ENV BS_RELEASE_TAG=${{ steps.latestrelease.outputs.latestrelease }}/" Dockerfile.ui

          docker build . --file Dockerfile.ui --tag ghcr.io/area128/bricksync-docker:ui-${{ steps.latestrelease.outputs.latestrelease }}
          docker image tag ghcr.io/area128/bricksync-docker:ui-${{ steps.latestrelease.outputs.latestrelease }} ghcr.io/area128/bricksync-docker:ui-latest
          docker push ghcr.io/area128/bricksync-docker:ui-${{ steps.latestrelease.outputs.latestrelease }}
          docker push ghcr.io/area128/bricksync-docker:ui-latest

